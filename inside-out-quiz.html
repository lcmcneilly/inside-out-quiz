<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What have you not looked at? · Inside Out</title>
<meta name="description" content="Eight questions. Nothing is scored and nothing is compared.">
<meta property="og:title" content="What have you not looked at?">
<meta property="og:description" content="Eight questions, about three minutes. Inside Out opens 31 October.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   INSIDE OUT — brand direction v2, October 2026
   Gold #EFBD40 · Ink #1A1B20, the only dark ground · Ivory #E8DCC4
   Cormorant display (never below 20px) · Inter labels and UI · Montserrat
   body at 1.7 minimum. Never bold. Italics for emphasis. Ragged right,
   never justified, never centred.
   =========================================================================== */
:root{
  --gold:#EFBD40; --ink:#1A1B20; --ivory:#E8DCC4; --paper:#FAF8F4;
  --card:#FFFCF2; --surface:#E2DCD0;
  --body:#55524B; --mute:#A9A398; --line:#D8D2C6; --line-soft:#E2DCD0;
  --gold-ink:#8A6A14;                   /* gold darkened so it passes on paper */
  --display:'Cormorant Garamond',Georgia,serif;
  --ui:'Inter',system-ui,sans-serif;
  --text:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html{background:var(--paper)}
body{background:var(--paper);color:var(--body);font-family:var(--text);
  font-weight:400;font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
main{max-width:700px;margin:0 auto;padding:0 28px 88px}
em,i{font-style:italic}
strong,b{font-weight:400}                     /* never bold */
p{max-width:58ch}
h1,h2{font-family:var(--display);font-weight:400;color:var(--ink);line-height:1.05}
h1{font-size:clamp(2.7rem,7.6vw,4.3rem)}
.eyebrow{font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold-ink)}
.mark{display:block;width:60px;height:60px}
.mark svg{width:60px;height:60px;display:block}
.btn{display:inline-block;font-family:var(--ui);font-size:12px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink);background:transparent;
  border:1px solid var(--ink);border-radius:0;padding:16px 38px;cursor:pointer;
  transition:background .2s,color .2s;text-decoration:none}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:#000}
.rule-gold{width:84px;height:2px;background:var(--gold);margin:38px 0}
/* opening — the questions are the content, so almost nothing sits in front */
.open{padding:84px 0 40px}
.open .mark{margin-bottom:44px}
.open .eyebrow{display:block;margin-bottom:18px}
.open h1{margin-bottom:26px;max-width:16ch}
.open p{font-size:1.06rem}
/* the seven */
#quiz{display:none;padding:52px 0 40px;min-height:78vh}
.bar{height:2px;background:var(--line);margin-bottom:12px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width .35s ease}
.count{font-family:var(--ui);font-size:11px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--mute);display:block;margin-bottom:50px}
.q{font-family:var(--display);font-size:clamp(1.8rem,4.6vw,2.7rem);line-height:1.16;
  color:var(--ink);max-width:21ch;margin-bottom:44px}
.answers{display:flex;flex-direction:column;gap:12px;max-width:560px}
.answers button{font-family:var(--text);font-size:1.02rem;line-height:1.5;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:0;padding:19px 24px;
  text-align:left;cursor:pointer;transition:border-color .16s,background .16s}
.answers button:hover,.answers button:focus-visible{border-color:var(--ink);background:#fff}
.back{margin-top:40px;background:none;border:0;cursor:pointer;font-family:var(--ui);
  font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding:0}
.back:hover{color:var(--ink)}
/* the result — four short beats and a door */
#result{display:none;padding:80px 0 0}
#result .eyebrow{display:block;margin-bottom:20px}
.pattern{font-family:var(--display);font-size:clamp(3.4rem,11vw,5.6rem);line-height:.98;
  color:var(--ink);margin-bottom:18px}
.lede{font-family:var(--display);font-style:italic;font-size:clamp(1.4rem,3.4vw,1.85rem);
  line-height:1.3;color:var(--gold-ink);max-width:26ch;margin-bottom:26px}
.what{margin-bottom:36px}
.said{border-left:2px solid var(--gold);padding:2px 0 2px 24px;margin-bottom:40px}
.said p{font-family:var(--display);font-size:1.25rem;line-height:1.45;color:var(--ink);max-width:44ch}
.sit{background:var(--surface);padding:30px 32px;margin-bottom:40px}
.sit p{font-family:var(--display);font-style:italic;font-size:1.28rem;line-height:1.45;
  color:var(--ink);max-width:42ch}
@media(max-width:560px){.sit{padding:24px 22px}}
.next{margin-bottom:44px}
.hr{height:1px;background:var(--line-soft);margin:48px 0}
.door h2{font-size:clamp(1.7rem,4.2vw,2.3rem);margin-bottom:14px;max-width:20ch}
.door p{margin-bottom:28px}
.opens{font-family:var(--ui);font-size:11.5px;font-weight:600;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold-ink);margin-top:22px}
footer{margin-top:80px;padding-top:28px;border-top:1px solid var(--line-soft)}
footer p{font-family:var(--ui);font-size:12px;color:var(--mute);line-height:1.9}
footer .aw{font-family:var(--display);font-style:italic;font-size:1.15rem;color:var(--gold-ink);margin-bottom:8px}
</style>
</head>
<body>
<main>

<section class="open" id="open">
  <span class="mark" id="mark" aria-label="Inside Out"></span>
  <span class="eyebrow">Inside Out</span>
  <h1>What have you not looked at?</h1>
  <p>Eight questions. Nothing is scored and nothing is compared.</p>
  <div class="rule-gold" aria-hidden="true"></div>
  <button class="btn solid" id="begin" type="button">Begin</button>
</section>

<section id="quiz" aria-live="polite">
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  <span class="count" id="count"></span>
  <p class="q" id="qText"></p>
  <div class="answers" id="answers"></div>
  <button class="back" id="back" type="button">Back</button>
</section>

<section id="result">
  <span class="eyebrow">The pattern to watch</span>
  <h2 class="pattern" id="patternName"></h2>
  <p class="lede" id="lede"></p>
  <p class="what" id="what"></p>
  <div class="said" id="said"></div>
  <div class="sit"><p id="sitWith"></p></div>
  <p class="next" id="next"></p>

  <div class="hr" aria-hidden="true"></div>

  <div class="door">
    <h2 id="doorHead"></h2>
    <p id="doorCopy"></p>
    <a class="btn solid" id="cta" href="#">Inside Out</a>
    <p class="opens" id="opensLine">Doors open 31 October</p>
  </div>
</section>

<footer>
  <p class="aw">As within, so without.</p>
  <p>Inside Out · SHE IS SOL and SHE IS AI.<br>This is where you are standing right now, not who you are.</p>
</footer>

</main>

<script>
'use strict';
/* ===========================================================================
   WHAT HAVE YOU NOT LOOKED AT?  ·  Inside Out funnel quiz

   Eight questions: five reflections and three on how someone works with AI.
   Nothing is named. No pattern, no archetype, no score — the Sol Map names
   it properly and reads it against the day you were born, and spending that
   headline here would leave the real instrument with nothing to say.

   The result is four short beats: one line, their own answer back, one
   question, and a door.
   =========================================================================== */

const CONFIG = {
  /* The Inside Out landing page, per the brand direction. */
  landingUrl: "https://sheisai.ai/inside",
  ctaLabel:   "Join the waitlist",
  opensLine:  "Doors open 31 October"
};

/* ---------------------------------------------------------------------------
   THE FOUR REFLECTIONS
   t = territory, internal only, never shown.
   w = how present that territory is, 0–2.
   said = how the answer gets read back. Their words, not a diagnosis.
   --------------------------------------------------------------------------- */
const REFLECT = [
 {id:'r1', t:'verdict',
  q:`At the end of an ordinary day, which is closer?`,
  a:[[`I run back through how I did`,2,`an ordinary day ends with you running back through how you did`],
     [`It depends on the day`,1,null],
     [`The day just ends`,0,null]]},
 {id:'r2', t:'measuring',
  q:`You open your phone and the first thing you see is somebody else's good news. What do you do?`,
  a:[[`Keep moving past it`,2,`you keep moving past somebody else's good news`],
     [`Look, then carry on`,1,null],
     [`Stop and read it properly`,0,null]]},
 {id:'r3', t:'steadiness',
  q:`How much can one conversation change how you feel about an entire day?`,
  a:[[`Completely. It sets the tone`,2,`one conversation can change how you feel about an entire day`],
     [`Somewhat`,1,null],
     [`Barely`,0,null]]},
 {id:'r4', t:'verdict',
  q:`You hear how someone else handled something difficult. What turns up first?`,
  a:[[`What I would have done instead`,2,`the first thing that turns up is what you would have done instead`],
     [`A question about why`,1,null],
     [`Nothing much. It was theirs to handle`,0,null]]},
 {id:'r5', t:'fear',
  q:`Somebody asks why you have not done the thing yet. What comes out of your mouth?`,
  a:[[`The reason I always give`,2,`there is a reason you always give for not having done it`],
     [`Something roughly honest`,1,null],
     [`A date`,0,null]]}
];

/* Four patterns, one per territory. Named, because a pattern you can name is
   a pattern you can watch. What undoes each one, and how it sits in a chart,
   is the Sol Map's job inside. */
const PATTERN = {
 verdict:{name:`Judgement`,
   line:`You reach a verdict fast, including on yourself.`,
   what:`Judgement arrives quickly and feels like clarity. It is a verdict reached before the evidence is in, and the quickest one is usually about you.`,
   ask:`Would you say to a friend what you say to yourself?`},
 measuring:{name:`Jealousy`,
   line:`You measure yourself against other people.`,
   what:`Jealousy is a measurement. It only works if you agree to stand on somebody else's timeline and read your own position from it.`,
   ask:`What do you actually want — not what they have?`},
 steadiness:{name:`Neediness`,
   line:`Other people have more say in how you feel than you do.`,
   what:`Neediness is not wanting people. It is handing your steadiness to somebody else to hold, and then resenting them for holding it.`,
   ask:`What are you waiting for somebody else to confirm?`},
 fear:{name:`Fear`,
   line:`You have a good reason, and you do not quite believe it.`,
   what:`Fear is the most reasonable-sounding of the four. It borrows the language of caution, calls itself realism, and gets waved through without being questioned.`,
   ask:`Is it actually risk, or is it only unfamiliar?`}
};
/* Shown instead of a quote when no answer sat at the far end. Two versions:
   one where something still separated the four, one where nothing did. */
const LIGHT = `None of the four ran loud in your answers. This is the one that showed at all, which is a different thing from it being a problem.`;
const LIGHTEST = `Nothing ran loud, and nothing separated the four. Take the pattern above as the lightest possible read rather than a finding.`;

/* ---------------------------------------------------------------------------
   THE THREE ON AI
   Not fear and not skill level. Authorship: what gets handed to it, what it is
   allowed to decide, and what happens on disagreeing with it.
   --------------------------------------------------------------------------- */
const AI = [
 {id:'a1',
  q:`Before you ask it something, how clear are you on what you actually want?`,
  a:[[`I work that out by asking`,0],[`Roughly clear`,1],[`Clear first, then I ask`,2]]},
 {id:'a2',
  q:`When you use AI on something that matters, whose thinking ends up in the finished thing?`,
  a:[[`Mostly mine. It speeds up work I had already decided on`,2],
     [`A mix, and I could not always tell you where the line is`,0],
     [`I do not use it for anything that matters`,0]]},
 {id:'a3',
  q:`When it gives you an answer and something in you says no, what usually happens?`,
  a:[[`I go with it anyway. It is easier than arguing with it`,0],
     [`Depends how much time I have`,1],
     [`I trust the no, and go and check`,2]]}
];
/* THE DOOR
   Two conditions, both required, in this order:
     1. Steady. No reflection answer at the far end, and the total load low.
     2. Authored. All three AI answers at the strong end.
   Capability handed to somebody who is not steady only moves faster in the
   wrong direction, so SOL is the default and the AI door has to be earned.
   STEADY_MAX is out of 10 (five reflections, two points each). */
const STEADY_MAX = 3;

const DOORS = {
 sol:{head:`Start at SHE IS SOL.`,
   copy:`Clarity first, then capability. AI gives back whatever you hand it, so what you are handing it is the thing worth working on. Both doors open onto the same place. This is only which to walk through first.`},
 ai:{head:`Start at SHE IS AI.`,
   copy:`Your answers came back steady, and your own thinking already sits at the centre of what you make with it. That combination is rare, and it is what the capability side is for. SHE IS SOL is in the same place whenever you want it.`}
};

/* -------------------------------------------------------------------- MARK */
/* One square split down the middle. The ivory side is the inside, where IN
   reads upright. The ink side is the world outside, where OUT is turned over.
   A single gold spark on the seam. */
function insideOutMark(){
 return `<svg viewBox="0 0 100 100" role="img" aria-label="Inside Out">
  <rect x="0" y="0" width="50" height="100" fill="#E8DCC4"/>
  <rect x="50" y="0" width="50" height="100" fill="#1A1B20"/>
  <text x="25" y="54" text-anchor="middle" font-family="Inter,sans-serif" font-size="11"
    font-weight="600" letter-spacing="1.1" fill="#1A1B20">IN</text>
  <text x="75" y="54" text-anchor="middle" font-family="Inter,sans-serif" font-size="11"
    font-weight="600" letter-spacing="1.1" fill="#E8DCC4" transform="rotate(180 75 50)">OUT</text>
  <circle cx="50" cy="50" r="3.4" fill="#EFBD40"/>
  <circle cx="50" cy="50" r="8" fill="none" stroke="#EFBD40" stroke-width=".8" opacity=".5"/>
 </svg>`;
}

/* ------------------------------------------------------------------- STATE */
const $ = id => document.getElementById(id);
/* Interleaved so the three on AI do not arrive as a block. */
const QUEUE = [REFLECT[0], AI[0], REFLECT[1], AI[1], REFLECT[2], REFLECT[4], REFLECT[3], AI[2]];
const picked = {};
let at = 0;

/* -------------------------------------------------------------------- QUIZ */
function render(){
 const q = QUEUE[at];
 $('barFill').style.width = ((at/QUEUE.length)*100).toFixed(1)+'%';
 $('count').textContent = 'Question '+(at+1)+' of '+QUEUE.length;
 $('qText').textContent = q.q;
 $('answers').innerHTML = q.a.map((o,i)=>'<button type="button" data-i="'+i+'">'+o[0]+'</button>').join('');
 $('back').style.visibility = at===0 ? 'hidden' : 'visible';
 window.scrollTo(0,0);
}
function choose(i){
 picked[QUEUE[at].id] = i;
 at++;
 if(at >= QUEUE.length) finish(); else render();
}

/* ----------------------------------------------------------------- READING */
/* Verdict carries two questions and the other two carry one each, so a raw
   total would hand verdict the result almost every time. Each territory is
   scored as a share of its own maximum instead; a tie goes to the territory
   with more questions behind it. */
function readReflections(){
 const got = {}, max = {}, strong = [];
 for(const q of REFLECT){
   max[q.t] = (max[q.t]||0) + 2;
   got[q.t] = got[q.t]||0;
   const i = picked[q.id]; if(i === undefined) continue;
   const [,w,said] = q.a[i];
   got[q.t] += w;
   if(w === 2 && said) strong.push({t:q.t, said:said});
 }
 const terrs = Object.keys(max);
 let lead = 'none', best = 0;
 for(const t of terrs){
   const share = got[t]/max[t];
   if(share > best || (share === best && share > 0 && max[t] > max[lead])){ best = share; lead = t; }
 }
 /* Never 'none'. If nothing ran loud, the highest raw score still names the
    pattern, and LIGHT says plainly that none of them were loud. */
 if(lead === 'none'){
   let top = -1;
   for(const t of terrs){ if(got[t] > top){ top = got[t]; lead = t; } }
 }
 return {lead, strong, got, max};
}
function readAI(){
 let total = 0, authored = true;
 for(const q of AI){
   const i = picked[q.id];
   const w = (i === undefined) ? 0 : q.a[i][1];
   total += w;
   if(w !== 2) authored = false;
 }
 return {total, authored};
}
function readDoor(R, T){
 const load = Object.keys(R.got).reduce((n,t)=>n+R.got[t],0);   /* 0–10 */
 /* A low total is not steadiness on its own: one pattern at full intensity
    is not centred, however quiet the rest is. Both have to hold. */
 const steady = R.strong.length === 0 && load <= STEADY_MAX;
 return {door:(steady && T.authored) ? 'ai' : 'sol', load, steady};
}

function finish(){
 const R = readReflections(), T = readAI(), D = readDoor(R, T);
 const P = PATTERN[R.lead];

 $('patternName').textContent = P.name;
 $('lede').textContent = P.line;
 $('what').textContent = P.what;

 const pick = R.strong.find(s => s.t === R.lead) || null;
 const nothingSeparated = Object.keys(R.got).every(t => R.got[t] === 0);
 $('said').innerHTML = pick ? '<p>You said '+pick.said+'.</p>'
   : '<p>'+(nothingSeparated ? LIGHTEST : LIGHT)+'</p>';
 $('said').style.display = 'block';

 $('sitWith').textContent = P.ask;

 $('next').textContent = `This is one of four patterns the work inside is built around. The Sol Map tells you which is loudest in you, what undoes it, and what your birth details add to the picture. It is the first thing you get when you join.`;

 const d = DOORS[D.door];
 $('doorHead').textContent = d.head;
 $('doorCopy').textContent = d.copy;

 $('quiz').style.display = 'none';
 $('result').style.display = 'block';
 window.scrollTo(0,0);
}

/* -------------------------------------------------------------------- BOOT */
document.addEventListener('DOMContentLoaded', function(){
 $('mark').innerHTML = insideOutMark();
 const cta = $('cta');
 if(CONFIG.landingUrl){ cta.href = CONFIG.landingUrl; cta.textContent = CONFIG.ctaLabel; }
 else { cta.removeAttribute('href'); cta.textContent = CONFIG.ctaLabel; cta.style.opacity = '.4'; }
 $('opensLine').textContent = CONFIG.opensLine || '';
 $('begin').addEventListener('click', function(){
   $('open').style.display='none'; $('quiz').style.display='block'; render();
 });
 $('answers').addEventListener('click', function(e){
   const b = e.target.closest('button[data-i]'); if(b) choose(+b.dataset.i);
 });
 $('back').addEventListener('click', function(){ if(at>0){ at--; render(); } });
});
</script>
</body>
</html>
